services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣으세요}
      POSTGRES_DB: ${POSTGRES_DB:-board}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-board}"]
      interval: 5s
      retries: 10
    # 포트를 밖으로 열지 않음 → DB는 api 컨테이너에서만 접근

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-board}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-board}
    ports:
      - "80:8000"   # EC2의 80 포트로 접속
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
